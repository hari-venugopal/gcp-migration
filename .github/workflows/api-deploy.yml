name: API deploy (canary)

on:
  push:
    branches: [main]
    paths: ["api/**"]
  workflow_dispatch:
    inputs:
      canary_percent:
        description: "Traffic % for the new revision"
        required: true
        default: "10"

permissions:
  contents: read
  id-token: write # keyless auth to GCP

env:
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.API_SERVICE }}
  IMAGE: ${{ vars.AR_REPO }}/items-api:${{ github.sha }}
  CANARY_PERCENT: ${{ inputs.canary_percent || '10' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" api
          docker push "$IMAGE"

      - name: Deploy new revision with zero traffic
        run: |
          SHORT="${GITHUB_SHA::7}"
          TAG="c-${SHORT}"
          gcloud run deploy "$SERVICE" \
            --region "$REGION" \
            --image "$IMAGE" \
            --no-traffic \
            --tag "$TAG" \
            --update-env-vars "APP_VERSION=${SHORT}" \
            --quiet
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Shift canary traffic
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --to-tags "${TAG}=${CANARY_PERCENT}" \
            --quiet
          gcloud run services describe "$SERVICE" --region "$REGION" --format="yaml(status.traffic)"
          echo "Canary is live at ${CANARY_PERCENT}%. Watch errors and latency, then run 'API traffic' to promote or roll back."
